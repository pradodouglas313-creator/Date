<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel — MeuDate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Painel — Meus Convites</h1>

    <p class="note">Este painel lê convites do seu navegador (localStorage). Para ver convites criados em outro dispositivo, importe o JSON do convite aqui (Exportar/Importar).</p>

    <div class="row" style="margin-bottom:12px">
      <button id="importBtn">Importar convite (.json)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button id="clearAllBtn">Limpar todos os convites</button>
    </div>

    <div id="invitesList">Carregando…</div>

    <p style="margin-top:18px"><a href="index.html">Voltar ao site</a></p>
  </main>

  <script>
  (function(){
    const LS_KEY = 'meudate_invites_v1';
    function loadLocalInvites(){ try{ return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ return {}; } }
    function saveLocalInvites(obj){ localStorage.setItem(LS_KEY, JSON.stringify(obj)); }
    const invitesList = document.getElementById('invitesList');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const clearAllBtn = document.getElementById('clearAllBtn');

    function render(){
      invitesList.innerHTML = '';
      const all = loadLocalInvites();
      const keys = Object.keys(all);
      if(keys.length===0){ invitesList.innerHTML = '<div class="muted">Nenhum convite salvo localmente.</div>'; return; }
      keys.reverse().forEach(code=>{
        const inv = all[code];
        const el = document.createElement('div');
        el.className = 'inviteCard';
        el.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px">
            ${inv.image ? `<img src="${inv.image}" style="width:84px;height:56px;object-fit:cover;border-radius:6px">` : ''}
            <div style="flex:1">
              <strong>${inv.title || 'Sem título'}</strong>
              <div class="muted">Autor: ${inv.creatorName || ''}</div>
              <div style="margin-top:6px">Código: <code class="code">${inv.code}</code></div>
              <div style="margin-top:8px" class="row">
                <a class="button" href="/d/${inv.code}">Ver convite</a>
                <button class="button" data-code="${inv.code}" onclick="openResponses('${inv.code}')">Ver respostas</button>
                <button class="button" data-code="${inv.code}" onclick="exportInvite('${inv.code}')">Exportar</button>
                <button class="button" data-code="${inv.code}" onclick="deleteInvite('${inv.code}')">Apagar</button>
              </div>
            </div>
          </div>
          <div id="responses-${inv.code}" class="responsesArea"></div>
        `;
        invitesList.appendChild(el);
      });
    }

    window.openResponses = function(code){
      const area = document.getElementById('responses-' + code);
      area.innerHTML = 'Carregando respostas…';
      const all = loadLocalInvites();
      const inv = all[code];
      area.innerHTML = '';
      if(!inv || !inv.responses || inv.responses.length===0){ area.innerHTML = '<div class="muted">Nenhuma resposta ainda.</div>'; return; }
      inv.responses.slice().reverse().forEach(r=>{
        const dStr = r.date ? new Date(r.date).toLocaleDateString() : '';
        const div = document.createElement('div');
        div.className = 'responseItem';
        div.innerHTML = `<strong>${r.name||'Convidado'}</strong> — ${dStr} ${r.time || ''}<div class='muted'>${r.message||''}</div>`;
        area.appendChild(div);
      });
    };

    window.exportInvite = function(code){
      const all = loadLocalInvites();
      const inv = all[code];
      if(!inv) return alert('Convite não encontrado.');
      const blob = new Blob([JSON.stringify(inv, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `meudate-invite-${code}.json`; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };

    window.deleteInvite = function(code){
      if(!confirm('Apagar este convite localmente?')) return;
      const all = loadLocalInvites(); delete all[code]; saveLocalInvites(all); render();
    };

    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', async (ev)=>{
      const f = ev.target.files && ev.target.files[0];
      if(!f) return;
      try{
        const text = await f.text(); const obj = JSON.parse(text);
        if(!obj.code) obj.code = Math.random().toString(36).slice(2,8).toUpperCase();
        const all = loadLocalInvites(); all[obj.code] = obj; saveLocalInvites(all); render(); alert('Importado com sucesso.');
      }catch(e){ alert('Erro ao importar: ' + e.message); }
    });

    clearAllBtn.addEventListener('click', ()=> {
      if(!confirm('Apagar todos os convites locais?')) return;
      saveLocalInvites({}); render();
    });

    render();
  })();
  </script>
</body>
</html>
